<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sefi Bingo</title>
  <style>
    :root {
      --bg-main: #bfa5d9;
      --card-bg: #800080;
      --accent: #2e7d32;
      --accent-orange: #f57c00;
      --dark-purple: #4a148c;
      --text-white: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    #app {
      width: 100%;
      max-width: 480px;
      background: #c5a8e0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .view { display: none; flex-direction: column; flex: 1; }
    .view.active { display: flex; }

    /* Top Bar */
    .header-bar {
      background: #000;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .header-bar span { cursor: pointer; }

    /* Stats Ribbon */
    .stats-ribbon {
      background: var(--card-bg);
      padding: 4px 6px;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .stat-pill {
      background: #fff;
      color: #111;
      border-radius: 6px;
      padding: 3px 4px;
      flex: 1;
      text-align: center;
      font-size: 0.65rem;
      font-weight: bold;
    }
    .stat-pill.btn-pill {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.4);
      cursor: pointer;
      flex: 0 0 45px;
    }

    /* Welcome Screen */
    .welcome-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 16px;
    }
    .welcome-title { font-size: 1.8rem; color: var(--dark-purple); font-weight: 800; }
    .btn-primary {
      background: var(--dark-purple);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 80%;
    }

    /* Subbar */
    .selection-subbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      font-weight: bold;
      color: var(--accent);
      font-size: 0.85rem;
    }

    /* 600 Cartela Grid */
    .cartela-scroll-box {
      background: rgba(255, 255, 255, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 8px;
      margin: 0 8px 60px 8px;
      padding: 6px;
      height: 68vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 4px;
    }
    .cartela-node {
      background: #ff7043;
      color: #fff;
      border: 1px solid #d84315;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      cursor: pointer;
    }
    .cartela-node.selected { background: #2e7d32; border-color: #1b5e20; }

    /* Active Arena Layout */
    .game-arena {
      display: flex;
      flex: 1;
      padding: 6px;
      gap: 6px;
      height: calc(100vh - 150px);
    }
    .left-board {
      flex: 1.1;
      background: rgba(255,255,255,0.7);
      border-radius: 6px;
      padding: 4px;
      display: flex;
      flex-direction: column;
    }
    .bingo-header {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      font-weight: bold;
      text-align: center;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }
    .bingo-header div { padding: 2px 0; border-radius: 2px; color: #fff; }
    .b-b { background: #d32f2f; }
    .b-i { background: #1976d2; }
    .b-n { background: #388e3c; }
    .b-g { background: #f57c00; }
    .b-o { background: #7b1fa2; }
    .master-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(15, 1fr);
      gap: 2px;
      flex: 1;
    }
    .m-cell {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: bold;
      color: #333;
    }
    .m-cell.hit-green { background: #2e7d32; color: #fff; }
    .m-cell.hit-orange { background: #f57c00; color: #fff; }

    .right-board {
      flex: 1.4;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .current-call {
      background: #fff;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
    }
    .call-badge {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--dark-purple);
    }
    .controls-strip {
      display: flex;
      gap: 4px;
    }
    .ctrl-tag {
      flex: 1;
      background: #fff;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      cursor: pointer;
    }
    .ctrl-tag.active { background: #2e7d32; color: #fff; }

    /* Player Card 5x5 */
    .player-card-box {
      background: #fff;
      border-radius: 6px;
      padding: 4px;
      flex: 1;
      overflow-y: auto;
    }
    .grid-5x5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
      margin-top: 4px;
    }
    .p-cell {
      aspect-ratio: 1;
      background: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
    }
    .p-cell.marked { background: #f57c00; color: #fff; }
    .p-cell.free { background: #388e3c; color: #fff; }

    /* Bottom Actions */
    .bottom-actions {
      display: flex;
      gap: 6px;
      padding: 6px;
      background: #333;
      position: sticky;
      bottom: 48px;
    }
    .btn-act {
      flex: 1;
      padding: 8px 0;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      color: #fff;
    }
    .btn-leave { background: #d32f2f; }
    .btn-bingo { background: #2e7d32; flex: 2; font-size: 0.9rem; }

    /* Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: 48px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 0.65rem;
      font-weight: bold;
      color: #666;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .nav-item.active { color: var(--card-bg); }

    /* Modal */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }
    .modal-box {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Top Header -->
    <div class="header-bar">
      <span>&#9776;</span>
      <span>Sefi Bingo</span>
      <span id="mute-btn">&#128266;</span>
    </div>

    <!-- Live Stats Ribbon -->
    <div class="stats-ribbon">
      <div class="stat-pill">Balance: <span id="stat-balance">10</span> ETB</div>
      <div class="stat-pill">Call: <span id="stat-calls">0</span></div>
      <div class="stat-pill">Player: <span id="stat-players">0</span></div>
      <div class="stat-pill">Stake: <span id="stat-stake">10</span> ETB</div>
      <div class="stat-pill">Win: <span id="stat-win">0</span> ETB</div>
      <div class="stat-pill btn-pill" id="btn-stats-back">Back</div>
    </div>

    <!-- 1. Welcome Screen -->
    <div id="view-welcome" class="view active">
      <div class="welcome-wrap">
        <h2 class="welcome-title">እንኳን ወደ Sefi Bingo በደህና መጡ!</h2>
        <p>የመግቢያ ቦነስ 10 ብር ተሰጥቷችኋል።</p>
        <button class="btn-primary" id="btn-start-play">ጨዋታ ጀምር</button>
      </div>
    </div>

    <!-- 2. Cartela Selection Screen -->
    <div id="view-selection" class="view">
      <div class="selection-subbar">
        <span>ካርቴላ ምረጥ (ከ 1 እስከ 3)</span>
        <span id="timer-box">ቀሪ ሰከንድ: 30</span>
      </div>
      <div class="cartela-scroll-box" id="cartela-grid">
        <!-- 1 - 600 Cartelas generated via JS -->
      </div>
    </div>

    <!-- 3. Active Arena Screen -->
    <div id="view-arena" class="view">
      <div class="game-arena">
        <!-- Master Board (1 - 75) -->
        <div class="left-board">
          <div class="bingo-header">
            <div class="b-b">B</div>
            <div class="b-i">I</div>
            <div class="b-n">N</div>
            <div class="b-g">G</div>
            <div class="b-o">O</div>
          </div>
          <div class="master-grid" id="master-grid">
            <!-- 15x5 Cells -->
          </div>
        </div>

        <!-- Right Side: Calls & Player Cards -->
        <div class="right-board">
          <div class="current-call">
            <div style="font-size:0.75rem; color:#666;">የተጠራው ቁጥር</div>
            <div class="call-badge" id="current-call-display">--</div>
          </div>
          <div class="controls-strip">
            <div class="ctrl-tag active" id="btn-auto-daub">Auto Daub</div>
            <div class="ctrl-tag" id="btn-switch-card">ቀጣይ ካርድ</div>
          </div>
          <div class="player-card-box">
            <div style="font-size:0.7rem; font-weight:bold; text-align:center; color:var(--card-bg);" id="card-label">ካርቴላ ቁጥር: -</div>
            <div class="grid-5x5" id="player-card-grid">
              <!-- 5x5 Matrix -->
            </div>
          </div>
        </div>
      </div>

      <!-- Action Footer -->
      <div class="bottom-actions">
        <button class="btn-act btn-leave" id="btn-leave-game">ውጣ</button>
        <button class="btn-act btn-bingo" id="btn-call-bingo">ቢንጎ (BINGO)</button>
      </div>
    </div>

    <!-- Modal Notifications -->
    <div class="modal" id="system-modal">
      <div class="modal-box">
        <h3 id="modal-title" style="margin-bottom:8px; color:var(--dark-purple);">ማስታወቂያ</h3>
        <p id="modal-msg" style="font-size:0.85rem; margin-bottom:12px;"></p>
        <button class="btn-primary" style="width:100%; padding:8px 0;" id="modal-close">እሺ</button>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <div class="nav-item active" id="nav-home"><span>&#127968;</span>ዋና ገጽ</div>
      <div class="nav-item" id="nav-wallet"><span>&#128176;</span>ዋሌት</div>
      <div class="nav-item" id="nav-history"><span>&#128220;</span>ታሪክ</div>
      <div class="nav-item" id="nav-settings"><span>&#9881;</span>ቅንብሮች</div>
    </div>
  </div>

  <script>
    // System State
    const STATE = {
      balance: 10,
      selectedCards: [],
      currentCardIndex: 0,
      playersCount: 0,
      stake: 10,
      adminCut: 0.20,
      winnerCut: 0.80,
      isAutoDaub: true,
      soundMuted: false,
      callInterval: null,
      selectionTimer: null,
      timeLeft: 30,
      calledNumbers: [],
      deck: [],
      cartelaData: {},
      isGameOver: false
    };

    // DOM References
    const dom = {
      views: {
        welcome: document.getElementById('view-welcome'),
        selection: document.getElementById('view-selection'),
        arena: document.getElementById('view-arena')
      },
      balance: document.getElementById('stat-balance'),
      calls: document.getElementById('stat-calls'),
      players: document.getElementById('stat-players'),
      stake: document.getElementById('stat-stake'),
      win: document.getElementById('stat-win'),
      cartelaGrid: document.getElementById('cartela-grid'),
      timerBox: document.getElementById('timer-box'),
      masterGrid: document.getElementById('master-grid'),
      callDisplay: document.getElementById('current-call-display'),
      playerCardGrid: document.getElementById('player-card-grid'),
      cardLabel: document.getElementById('card-label'),
      modal: document.getElementById('system-modal'),
      modalTitle: document.getElementById('modal-title'),
      modalMsg: document.getElementById('modal-msg'),
      modalClose: document.getElementById('modal-close'),
      muteBtn: document.getElementById('mute-btn')
    };

    // Amharic Audio Announcement
    function speakAmharic(text) {
      if (STATE.soundMuted || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'am-ET';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    // Modal Helper
    function showModal(title, msg, onClose = null) {
      dom.modalTitle.innerText = title;
      dom.modalMsg.innerText = msg;
      dom.modal.style.display = 'flex';
      dom.modalClose.onclick = () => {
        dom.modal.style.display = 'none';
        if (onClose) onClose();
      };
    }

    function switchView(viewName) {
      Object.keys(dom.views).forEach(key => dom.views[key].classList.remove('active'));
      dom.views[viewName].classList.add('active');
    }

    function updateStats() {
      dom.balance.innerText = STATE.balance;
      dom.calls.innerText = STATE.calledNumbers.length;
      dom.players.innerText = STATE.playersCount;
      const totalPool = STATE.playersCount * STATE.stake;
      const winPot = totalPool * STATE.winnerCut;
      dom.win.innerText = winPot;
    }

    // 1. Setup Selection Screen (1 - 600 Cartelas)
    function buildSelectionGrid() {
      dom.cartelaGrid.innerHTML = '';
      for (let i = 1; i <= 600; i++) {
        const node = document.createElement('div');
        node.className = 'cartela-node';
        node.innerText = i;
        node.onclick = () => toggleCartelaSelection(i, node);
        dom.cartelaGrid.appendChild(node);
      }
    }

    function toggleCartelaSelection(id, elem) {
      const idx = STATE.selectedCards.indexOf(id);
      if (idx > -1) {
        STATE.selectedCards.splice(idx, 1);
        elem.classList.remove('selected');
      } else {
        if (STATE.selectedCards.length >= 3) {
          showModal("ማስጠንቀቂያ", "ከ 3 ካርቴላ በላይ መምረጥ አይቻልም!");
          return;
        }
        STATE.selectedCards.push(id);
        elem.classList.add('selected');
      }
    }

    // Generate Standard 5x5 Card Matrix
    function generateCardMatrix(cardId) {
      const cols = {
        b: getShuffledRange(1, 15, 5),
        i: getShuffledRange(16, 30, 5),
        n: getShuffledRange(31, 45, 5),
        g: getShuffledRange(46, 60, 5),
        o: getShuffledRange(61, 75, 5)
      };
      cols.n[2] = 'FREE';

      const matrix = [];
      for (let r = 0; r < 5; r++) {
        matrix.push([cols.b[r], cols.i[r], cols.n[r], cols.g[r], cols.o[r]]);
      }
      return matrix;
    }

    function getShuffledRange(min, max, count) {
      const arr = [];
      for (let i = min; i <= max; i++) arr.push(i);
      arr.sort(() => Math.random() - 0.5);
      return arr.slice(0, count);
    }

    // 2. Selection Timing & Flow
    function startSelectionPhase() {
      STATE.selectedCards = [];
      STATE.timeLeft = 30;
      switchView('selection');
      buildSelectionGrid();

      clearInterval(STATE.selectionTimer);
      STATE.selectionTimer = setInterval(() => {
        STATE.timeLeft--;
        dom.timerBox.innerText = `ቀሪ ሰከንድ: ${STATE.timeLeft}`;
        if (STATE.timeLeft <= 0) {
          clearInterval(STATE.selectionTimer);
          finalizeCartelaChoice();
        }
      }, 1000);
    }

    function finalizeCartelaChoice() {
      if (STATE.selectedCards.length === 0) {
        STATE.selectedCards.push(Math.floor(Math.random() * 600) + 1);
      }
      const totalCost = STATE.selectedCards.length * STATE.stake;
      if (STATE.balance < totalCost) {
        showModal("ቀሪ ሂሳብ አነስተኛ ነው", "በቂ ቀሪ ሂሳብ ስለሌለዎት መጫወት አይችሉም!", () => {
          switchView('welcome');
        });
        return;
      }

      // Deduct balance
      STATE.balance -= totalCost;
      STATE.playersCount = Math.floor(Math.random() * 45) + 5;
      updateStats();

      // Build card data
      STATE.cartelaData = {};
      STATE.selectedCards.forEach(id => {
        STATE.cartelaData[id] = {
          matrix: generateCardMatrix(id),
          daubed: { '2,2': true }
        };
      });

      launchArena();
    }

    // 3. Game Arena Setup
    function launchArena() {
      switchView('arena');
      STATE.isGameOver = false;
      STATE.calledNumbers = [];
      STATE.currentCardIndex = 0;

      // Populate Deck (1 - 75)
      STATE.deck = [];
      for (let i = 1; i <= 75; i++) STATE.deck.push(i);
      STATE.deck.sort(() => Math.random() - 0.5);

      buildMasterGrid();
      renderCurrentPlayerCard();

      // Calling Loop
      clearInterval(STATE.callInterval);
      STATE.callInterval = setInterval(callNextBall, 3500);
    }

    function buildMasterGrid() {
      dom.masterGrid.innerHTML = '';
      for (let r = 0; r < 15; r++) {
        for (let c = 0; c < 5; c++) {
          const val = c * 15 + (r + 1);
          const cell = document.createElement('div');
          cell.className = 'm-cell';
          cell.id = `m-cell-${val}`;
          cell.innerText = val;
          dom.masterGrid.appendChild(cell);
        }
      }
    }

    function getBingoLetter(num) {
      if (num <= 15) return 'B';
      if (num <= 30) return 'I';
      if (num <= 45) return 'N';
      if (num <= 60) return 'G';
      return 'O';
    }

    function callNextBall() {
      if (STATE.deck.length === 0 || STATE.isGameOver) {
        clearInterval(STATE.callInterval);
        return;
      }
      const call = STATE.deck.pop();
      STATE.calledNumbers.push(call);
      const letter = getBingoLetter(call);

      dom.callDisplay.innerText = `${letter}-${call}`;
      speakAmharic(`${letter} ${call}`);

      // Highlight Master Board
      const prev = document.querySelectorAll('.m-cell.hit-orange');
      prev.forEach(el => { el.classList.remove('hit-orange'); el.classList.add('hit-green'); });
      const currentCell = document.getElementById(`m-cell-${call}`);
      if (currentCell) currentCell.classList.add('hit-orange');

      // Auto Daubing
      if (STATE.isAutoDaub) {
        STATE.selectedCards.forEach(cid => {
          const cData = STATE.cartelaData[cid];
          for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
              if (cData.matrix[r][c] === call) {
                cData.daubed[`${r},${c}`] = true;
              }
            }
          }
        });
      }

      updateStats();
      renderCurrentPlayerCard();
    }

    function renderCurrentPlayerCard() {
      const cardId = STATE.selectedCards[STATE.currentCardIndex];
      dom.cardLabel.innerText = `ካርቴላ ቁጥር: #${cardId} (${STATE.currentCardIndex + 1}/${STATE.selectedCards.length})`;
      dom.playerCardGrid.innerHTML = '';

      const cData = STATE.cartelaData[cardId];
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const cell = document.createElement('div');
          const val = cData.matrix[r][c];
          cell.className = 'p-cell';
          cell.innerText = val;

          if (val === 'FREE') {
            cell.classList.add('free');
          } else if (c
