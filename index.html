
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEFI BINGO</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#c4a7d0;
 color:#40104e;
}
header{
 background:#750080;
 color:white;
 padding:18px;
 text-align:center;
 font-size:25px;
 font-weight:bold;
}
.page{padding:15px;display:none}
.active{display:block}
.welcome{
 margin:35px 5px;
 padding:30px 10px;
 text-align:center;
 color:white;
 font-size:34px;
 font-weight:bold;
 border-radius:30px;
 background:linear-gradient(130deg,#a000a9,#510064);
}
.wallet{
 background:#800080;
 color:white;
 padding:17px;
 margin:20px auto;
 border-radius:30px;
 text-align:center;
 width:65%;
 font-weight:bold;
}
.box{
 border:3px solid #87008d;
 border-radius:30px;
 padding:15px;
 text-align:center;
}
.stake{
 display:block;
 width:100%;
 margin:15px 0;
 padding:20px;
 border:0;
 border-radius:50px;
 color:white;
 font-size:23px;
 font-weight:bold;
 background:#299b83;
}
.stake:nth-of-type(2){background:#e17d35}
button{cursor:pointer}
.top{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:5px;
}
.top button{
 border:0;
 padding:13px 2px;
 border-radius:12px;
 font-weight:bold;
 background:white;
 color:#62006d;
}
.info{
 display:flex;
 justify-content:space-between;
 font-weight:bold;
 color:green;
 margin:15px 0;
}
.gamegrid{
 display:grid;
 grid-template-columns:1fr 1.5fr;
 gap:8px;
}
.card{
 background:#b9acd0;
 border:2px solid white;
 border-radius:10px;
 padding:5px;
}
.bingo{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:5px;
}
.cell{
 min-width:0;
 height:40px;
 border:1px solid white;
 border-radius:9px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 background:#b7b1d0;
 color:#292238;
}
.cell.marked{
 background:#ff8900;
 color:#222;
}
.bhead{
 background:#85008a;
 color:white;
 font-weight:bold;
}
.bhead:nth-child(1){background:orange}
.bhead:nth-child(2){background:green}
.bhead:nth-child(3){background:blue}
.bhead:nth-child(4){background:red}
.bhead:nth-child(5){background:#71006f}
.right{text-align:center}
.callbox{
 background:#790080;
 color:white;
 padding:20px 5px;
 border-radius:40px;
 font-size:22px;
 font-weight:bold;
 margin-bottom:15px;
}
.number{
 margin:15px auto;
 width:75px;
 height:75px;
 background:#ff8500;
 border-radius:50%;
 display:grid;
 place-items:center;
 font-size:35px;
 color:white;
}
.control{
 display:flex;
 justify-content:space-around;
 align-items:center;
 background:#ddd0e9;
 padding:12px 2px;
 border-radius:15px;
}
.control button{
 border:0;
 padding:8px;
 background:#790080;
 color:white;
 border-radius:10px;
}
.message{
 margin-top:20px;
 background:#b9a9d0;
 border-radius:15px;
 min-height:180px;
 padding:20px;
 font-size:20px;
 font-weight:bold;
}
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 width:100%;
 background:#d5c1df;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 padding:10px 3px;
 border-top:2px solid white;
}
.bottom button{
 background:none;
 border:0;
 color:#650078;
 font-weight:bold;
 padding:10px 0;
}
.bottom button.selected{
 background:#790080;
 color:white;
 border-radius:18px;
}
.actions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:5px;
 margin-top:15px;
}
.actions button{
 padding:14px 2px;
 border:0;
 border-radius:15px;
 background:#800080;
 color:white;
 font-weight:bold;
}
#calledList{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin-top:15px;
}
#calledList span{
 padding:8px;
 border-radius:8px;
 background:#ff8900;
 color:black;
}
@media(max-width:380px){
 .cell{height:34px;font-size:12px}
 .gamegrid{grid-template-columns:1fr 1.25fr}
}
</style>
</head>

<body>

<header>🎮 SEFI BINGO</header>

<!-- HOME -->
<section id="home" class="page active">

<div class="welcome">
Welcome<br>to<br>SEFI BINGO
</div>

<div class="wallet">
💳 Wallet: <span id="homeWallet">1000</span> Points
</div>

<div class="box">
<h2>Choose Your Game</h2>

<button class="stake" onclick="startGame(10)">
▶ Play — 10 Points
</button>

<button class="stake" onclick="startGame(20)">
▶ Play — 20 Points
</button>
</div>
</section>

<!-- GAME -->
<section id="game" class="page">

<div class="top">
<button onclick="leaveGame()">↩ Leave</button>
<button id="timer">30</button>
<button>Wallet<br><span id="wallet">1000</span></button>
<button>Stake<br><span id="stake">10</span></button>
</div>

<div class="info">
<span>Boards: 1/1</span>
<span>SEFI BINGO</span>
</div>

<div class="gamegrid">

<div class="card">
<div class="bingo" id="myCard"></div>
</div>

<div class="right">

<div class="callbox">
<span id="status">Ready</span>
<div class="number" id="current">--</div>
</div>

<div class="control">
<button onclick="soundToggle()">🔊 Sound</button>
<button onclick="toggleAuto()" id="auto">Auto OFF</button>
</div>

<div class="message" id="message">
Welcome to SEFI BINGO!
</div>

<div id="calledList"></div>
</div>
</div>

<div class="actions">
<button style="background:#d00019" onclick="leaveGame()">↩ Leave</button>
<button style="background:#164fe4" onclick="newGame()">↻ Refresh</button>
<button style="background:#25834a" onclick="toggleAuto()">Automatic</button>
</div>

</section>

<!-- HISTORY -->
<section id="history" class="page">
<h2>📜 Game History</h2>
<div id="historyList">No games played yet.</div>
</section>

<!-- WALLET -->
<section id="walletPage" class="page">
<h2>💳 My Wallet</h2>
<div class="wallet">
Your Points<br>
<h1 id="walletBalance">1000</h1>
</div>
<p>Free demo points only.</p>
</section>

<!-- PROFILE -->
<section id="profile" class="page">
<h2>👤 My Profile</h2>
<h3>SEFI MAN</h3>
<p>Welcome to SEFI BINGO</p>
<p>Version 1.0</p>
</section>

<nav class="bottom">
<button class="selected" onclick="showPage('home',this)">🎮<br>Game</button>
<button onclick="showPage('history',this)">◷<br>History</button>
<button onclick="showPage('walletPage',this)">▣<br>Wallet</button>
<button onclick="showPage('profile',this)">♙<br>Profile</button>
</nav>

<script>
let balance=1000;
let stake=10;
let numbers=[];
let called=[];
let card=[];
let timer=30;
let auto=false;
let interval=null;
let sound=true;
let history=[];

function showPage(id,btn){
 stopAuto();
 document.querySelectorAll('.page').forEach(p=>
 p.classList.remove('active'));
 document.getElementById(id).classList.add('active');

 document.querySelectorAll('.bottom button').forEach(b=>
 b.classList.remove('selected'));
 btn.classList.add('selected');

 updateWallet();
}

function updateWallet(){
 document.getElementById('wallet').textContent=balance;
 document.getElementById('homeWallet').textContent=balance;
 document.getElementById('walletBalance').textContent=balance;
}

function startGame(amount){
 stake=amount;
 document.getElementById('stake').textContent=stake;
 document.getElementById('home').classList.remove('active');
 document.getElementById('game').classList.add('active');
 newGame();
}

function createCard(){
 card=[];
 let html='';
 let letters=['B','I','N','G','O'];

 for(let col=0;col<5;col++){
  let min=col*15+1;
  let nums=[];

  while(nums.length<5){
   let n=Math.floor(Math.random()*15)+min;
   if(!nums.includes(n))nums.push(n);
  }

  card.push(nums);
 }

 html+=letters.map(x=>`<div class="cell bhead">${x}</div>`).join('');

 for(let row=0;row<5;row++){
  for(let col=0;col<5;col++){
   let n=card[col][row];
   html+=`<div class="cell" id="c${n}" onclick="mark(${n})">${n}</div>`;
  }
 }

 document.getElementById('myCard').innerHTML=html;
}

function newGame(){
 stopAuto();
 numbers=Array.from({length:75},(_,i)=>i+1);
 called=[];
 timer=30;

 document.getElementById('current').textContent='--';
 document.getElementById('status').textContent='Ready';
 document.getElementById('message').textContent='Good luck! Enjoy SEFI BINGO.';
 document.getElementById('calledList').innerHTML='';
 document.getElementById('timer').textContent=timer;

 createCard();
}

function callNumber(){
 if(numbers.length===0){
  stopAuto();
  document.getElementById('status').textContent='Finished';
  return;
 }

 let index=Math.floor(Math.random()*numbers.length);
 let n=numbers.splice(index,1)[0];
 called.push(n);

 document.getElementById('current').textContent=n;
 document.getElementById('status').textContent='Number Called';

 let letter=['B','I','N','G','O'][Math.floor((n-1)/15)];

 document.getElementById('message').textContent=
 letter+' - '+n;

 document.getElementById('calledList').innerHTML=
 called.map(x=>`<span>${x}</span>`).join('');

 document.getElementById('timer').textContent=timer;

 if(sound){
  try{
   let audio=new AudioContext();
   let osc=audio.createOscillator();
   osc.connect(audio.destination);
   osc.start();
   osc.stop(audio.currentTime+.1);
  }catch(e){}
 }
}

function mark(n){
 if(!called.includes(n)){
  document.getElementById('message').textContent=
  'ይህ ቁጥር ገና አልተጠራም!';
  return;
 }

 let el=document.getElementById('c'+n);
 if(el)el.classList.add('marked');

 checkBingo();
}

function checkBingo(){
 let marked=card.map(col=>col.filter(n=>
 document.getElementById('c'+n)?.classList.contains('marked')
 ));

 for(let i=0;i<5;i++){
  if(marked[i].length===5){
   win();
   return;
  }
 }

 for(let row=0;row<5;row++){
  if(card.every(col=>
   document.getElementById('c'+col[row])
   ?.classList.contains('marked'))){
   win();
   return;
  }
 }
}

function win(){
 stopAuto();
 document.getElementById('status').textContent='BINGO!';
 document.getElementById('message').textContent=
 '🎉 BINGO! Congratulations!';
}

function toggleAuto(){
 if(auto){
  stopAuto();
 }else{
  auto=true;
  document.getElementById('auto').textContent='Auto ON';
  interval=setInterval(()=>{
   callNumber();
  },3000);
 }
}

function stopAuto(){
 auto=false;
 clearInterval(interval);
 interval=null;
 document.getElementById('auto').textContent='Auto OFF';
}

function soundToggle(){
 sound=!sound;
}

function leaveGame(){
 stopAuto();
 history.push('SEFI BINGO - '+new Date().toLocaleString());
 document.getElementById('historyList').innerHTML=
 history.map(x=>'<p>'+x+'</p>').join('');
 document.querySelectorAll('.page').forEach(p=>
 p.classList.remove('active'));
 document.getElementById('home').classList.add('active');
}

updateWallet();
</script>
</body>
</html>
