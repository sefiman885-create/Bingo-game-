<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sefi Bingo</title>
  <style>
    :root {
      --bg-dark: #2a1635;
      --card-bg: #4a215d;
      --header-bg: #3d144e;
      --accent-orange: #f36c21;
      --accent-green: #1ca347;
      --accent-yellow: #ffeb3b;
      --text-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .top-header {
      background-color: #1a0b22;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
    }

    .status-ribbon {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
      gap: 6px;
      padding: 8px 10px;
      background: var(--header-bg);
      align-items: center;
    }

    .ribbon-box {
      background: #2a0b36;
      border: 1px solid #632c7a;
      border-radius: 8px;
      padding: 6px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 50px;
    }

    .ribbon-box .title {
      font-size: 11px;
      color: #c084fc;
      margin-bottom: 2px;
    }

    .ribbon-box .value {
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    .hidden-panel {
      display: none !important;
    }

    .call-banner {
      background: linear-gradient(90deg, #4a154b, #2f0743);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 12px;
      border-radius: 12px;
    }

    .call-badge {
      background: var(--accent-orange);
      color: white;
      font-size: 22px;
      font-weight: 900;
      padding: 6px 20px;
      border-radius: 20px;
    }

    .main-stage {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bingo-board {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .bingo-header {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      text-align: center;
      font-weight: 900;
      font-size: 20px;
      color: white;
    }

    .col-B { background: #f59e0b; }
    .col-I { background: #10b981; }
    .col-N { background: #3b82f6; }
    .col-G { background: #ef4444; }
    .col-O { background: #8b5cf6; }

    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
      background: #d1d5db;
      padding: 4px;
    }

    .bingo-cell {
      background: #ffffff;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: #1f2937;
      border-radius: 4px;
    }

    .bingo-cell.hit {
      background: var(--accent-yellow);
      color: #000;
    }

    .bingo-cell.winning-line {
      background: var(--accent-green) !important;
      color: #fff !important;
    }

    .bingo-cell.free {
      background: var(--accent-green);
      color: white;
      font-size: 24px;
    }

    .winner-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(20, 5, 30, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .winner-card {
      background: #e9d5ff;
      border-radius: 20px;
      width: 100%;
      max-width: 350px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .winner-banner {
      background: var(--accent-orange);
      color: white;
      width: 100%;
      text-align: center;
      padding: 12px 0;
      border-radius: 12px;
      font-size: 26px;
      font-weight: 900;
    }

    .winner-player-tag {
      background: #0ea5e9;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      margin: 12px 0;
    }

    .winner-board-number {
      color: #15803d;
      font-weight: 900;
      font-size: 16px;
      margin: 10px 0;
    }

    .winner-timer-box {
      background: var(--accent-orange);
      width: 100%;
      padding: 10px 0;
      text-align: center;
      border-radius: 12px;
      font-size: 32px;
      font-weight: 900;
      color: white;
    }

    .spectator-badge {
      background: #059669;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      margin: 4px auto;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <span>✕</span>
    <span>Sefi Bingo</span>
    <span>⋮</span>
  </div>

  <div class="status-ribbon">
    <div class="ribbon-box">
      <span class="title" id="stageLabel">Preparing...</span>
      <span class="value" id="timerDisplay">00:30</span>
    </div>
    
    <!-- Lobby ውስጥ ተደብቀው ጨዋታ ሲጀመር ብቻ የሚታዩ -->
    <div class="ribbon-box hidden-panel" id="playersPanel">
      <span class="title">Players</span>
      <span class="value" id="playersCount">0</span>
    </div>

    <div class="ribbon-box hidden-panel" id="derashPanel">
      <span class="title">Derash (80%)</span>
      <span class="value" id="derashValue">0 ETB</span>
    </div>

    <div class="ribbon-box">
      <span class="title">Wallet</span>
      <span class="value" id="walletBalance">0 ETB</span>
    </div>
  </div>

  <div id="spectatorNotice" class="spectator-badge">👁️ ተመልካች ሁነታ (Spectator Mode)</div>

  <div class="call-banner">
    <div>የተጠራው ቁጥር:</div>
    <div class="call-badge" id="currentCall">--</div>
  </div>

  <div class="main-stage">
    <div class="bingo-board">
      <div class="bingo-header">
        <div class="col-B">B</div>
        <div class="col-I">I</div>
        <div class="col-N">N</div>
        <div class="col-G">G</div>
        <div class="col-O">O</div>
      </div>
      <div class="bingo-grid" id="playerBoardGrid"></div>
    </div>
  </div>

  <!-- Winner Modal -->
  <div class="winner-overlay" id="winnerModal">
    <div class="winner-card">
      <div class="winner-banner">BINGO!</div>
      <div class="winner-player-tag" id="winnerNameTag">ቡቡዬ has won the game.</div>
      
      <div class="bingo-board" style="width: 100%;">
        <div class="bingo-header">
          <div class="col-B">B</div>
          <div class="col-I">I</div>
          <div class="col-N">N</div>
          <div class="col-G">G</div>
          <div class="col-O">O</div>
        </div>
        <div class="bingo-grid" id="winnerCardGrid"></div>
      </div>

      <div class="winner-board-number" id="winnerBoardNo">Board Number 527</div>
      <div class="winner-timer-box" id="modalCountdown">10</div>
    </div>
  </div>

  <script>
    const STAKE_PER_PLAYER = 10;
    const WINNER_SHARE = 0.80;
    let actualPlayers = 30; // እውነተኛ ተጫዋቾች ቁጥር

    let calledNumbers = new Set();
    let callInterval = null;

    // የአማርኛ ቁጥር መተርጎሚያ ስርዓት (1 እስከ 75)
    function convertNumberToAmharic(num) {
      const units = ["", "አንድ", "ሁለት", "ሦስት", "አራት", "አምስት", "ስድስት", "ሰባት", "ስምንት", "ዘጠኝ"];
      const teens = ["አስር", "አስራ አንድ", "አስራ ሁለት", "አስራ ሦስት", "አስራ አራት", "አስራ አምስት", "አስራ ስድስት", "አስራ ሰባት", "አስራ ስምንት", "አስራ ዘጠኝ"];
      const tens = ["", "", "ሃያ", "ሰላሳ", "አርባ", "ሃምሳ", "ስድሳ", "ሰባ", "ሰማንያ", "ዘጠና"];

      if (num < 10) return units[num];
      if (num >= 10 && num < 20) return teens[num - 10];
      
      const ten = Math.floor(num / 10);
      const unit = num % 10;
      return unit === 0 ? tens[ten] : `${tens[ten]} ${units[unit]}`;
    }

    // በአማርኛ ድምፅ መጥሪያ
    function speakAmharic(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'am-ET';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    function callAmharicNumber(letter, number) {
      const amharicLetters = { 'B': 'ቢ', 'I': 'አይ', 'N': 'ኤን', 'G': 'ጂ', 'O': 'ኦ' };
      const spokenLetter = amharicLetters[letter] || letter;
      const spokenNumber = convertNumberToAmharic(number);
      speakAmharic(`${spokenLetter}፣ ${spokenNumber}`);
    }

    function generateBoard() {
      const ranges = { B: [1, 15], I: [16, 30], N: [31, 45], G: [46, 60], O: [61, 75] };
      const board = { B: [], I: [], N: [], G: [], O: [] };
      for (let col in ranges) {
        let pool = [];
        for (let i = ranges[col][0]; i <= ranges[col][1]; i++) pool.push(i);
        pool.sort(() => Math.random() - 0.5);
        board[col] = pool.slice(0, 5);
      }
      return board;
    }

    function renderBoard(containerId, boardData, winningIndices = []) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      const letters = ['B', 'I', 'N', 'G', 'O'];

      for (let row = 0; row < 5; row++) {
        for (let c = 0; c < 5; c++) {
          const colLetter = letters[c];
          const cell = document.createElement("div");
          cell.className = "bingo-cell";
          const cellIndex = row * 5 + c;

          if (row === 2 && c === 2) {
            cell.innerHTML = "★";
            cell.classList.add("free");
          } else {
            const val = boardData[colLetter][row];
            cell.innerText = val;
            cell.dataset.value = val;
            if (calledNumbers.has(val)) cell.classList.add("hit");
          }

          if (winningIndices.includes(cellIndex)) {
            cell.classList.add("winning-line");
          }

          container.appendChild(cell);
        }
      }
    }

    const myBoard = generateBoard();
    renderBoard("playerBoardGrid", myBoard);

    // 1. ሎቢ (30 ሰከንድ ቆጣሪ)
    function startLobby() {
      document.getElementById("stageLabel").innerText = "Preparing...";
      document.getElementById("playersPanel").classList.add("hidden-panel");
      document.getElementById("derashPanel").classList.add("hidden-panel");

      let remaining = 30;
      const lobbyInterval = setInterval(() => {
        remaining--;
        const ss = String(remaining % 60).padStart(2, '0');
        document.getElementById("timerDisplay").innerText = `00:${ss}`;

        if (remaining <= 0) {
          clearInterval(lobbyInterval);
          startGameplay();
        }
      }, 1000);
    }

    // 2. ጨዋታው ሲጀመር (Players እና Derash ማሳየት)
    function startGameplay() {
      document.getElementById("stageLabel").innerText = "Live";
      document.getElementById("timerDisplay").innerText = "Game ON";

      // Players እና Derash ማሳየት
      document.getElementById("playersPanel").classList.remove("hidden-panel");
      document.getElementById("derashPanel").classList.remove("hidden-panel");

      const totalPool = actualPlayers * STAKE_PER_PLAYER;
      const derash = Math.round(totalPool * WINNER_SHARE);

      document.getElementById("playersCount").innerText = actualPlayers;
      document.getElementById("derashValue").innerText = `${derash} ETB`;

      let callCount = 0;
      callInterval = setInterval(() => {
        callCount++;
        const cols = ['B', 'I', 'N', 'G', 'O'];
        const col = cols[Math.floor(Math.random() * 5)];
        const ranges = { B: [1,15], I: [16,30], N: [31,45], G: [46,60], O: [61,75] };
        const num = Math.floor(Math.random() * (ranges[col][1] - ranges[col][0] + 1)) + ranges[col][0];

        calledNumbers.add(num);
        document.getElementById("currentCall").innerText = `${col}-${num}`;
        callAmharicNumber(col, num);

        renderBoard("playerBoardGrid", myBoard);

        // ለሙከራ በ15ኛው ጥሪ ላይ አሸናፊ ማውጣት
        if (callCount >= 15) {
          clearInterval(callInterval);
          triggerWinner();
        }
      }, 3500);
    }

    // 3. አሸናፊ ሲኖር (ቢንጎ ማለት እና ካርቴላ ማሳየት)
    function triggerWinner() {
      speakAmharic("ቢንጎ! አሸናፊ ተገኝቷል!");

      const modal = document.getElementById("winnerModal");
      const countdownBox = document.getElementById("modalCountdown");
      const winnerBoard = generateBoard();

      // ያሸነፈበትን ረድፍ በአረንጓዴ ማሳየት (ለምሳሌ አግድም ረድፍ)
      const winningRowIndices = [10, 11, 12, 13, 14];
      renderBoard("winnerCardGrid", winnerBoard, winningRowIndices);

      modal.style.display = "flex";

      let seconds = 10;
      countdownBox.innerText = seconds;
      const modalTimer = setInterval(() => {
        seconds--;
        countdownBox.innerText = seconds;

        if (seconds <= 0) {
          clearInterval(modalTimer);
          modal.style.display = "none";
          calledNumbers.clear();
          startLobby(); // አዲስ ዙር መጀመር
        }
      }, 1000);
    }

    window.onload = startLobby;
  </script>
</body>
</html>
