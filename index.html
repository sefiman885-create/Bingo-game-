<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sefi Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a0b2e;
            color: #ffffff;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            background: #2b1254;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .stat-box { text-align: center; }
        .stat-val { color: #f59e0b; font-size: 16px; }

        /* Current Call / ቆጣሪ ማሳያ */
        .call-display {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 12px;
        }
        .current-ball {
            display: inline-block;
            width: 70px;
            height: 70px;
            line-height: 70px;
            background: #ffffff;
            color: #1a0b2e;
            border-radius: 50%;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* ከ 1 እስከ 600 ያሉ ቁጥሮች መረጣ */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            max-height: 240px;
            overflow-y: scroll;
            background: #231145;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .num-btn {
            background: #472680;
            color: white;
            border: none;
            padding: 10px 0;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .num-btn.selected { background: #10b981; }

        /* ዲፖዚት ክፍያ ክፍል */
        .deposit-section {
            background: #241442;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 12px;
        }
        .pay-btn {
            padding: 10px 18px;
            margin: 6px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .telebirr { background: #0080ff; color: white; }
        .cbe { background: #800080; color: white; }
    </style>
</head>
<body>

    <!-- የጨዋታው መረጃዎች -->
    <div class="header-bar">
        <div class="stat-box">ደራሽ (ገንዳ)<div class="stat-val" id="derashVal">650 ብር</div></div>
        <div class="stat-box">ተጫዋቾች<div class="stat-val" id="playersVal">78</div></div>
        <div class="stat-box">ስቴክ<div class="stat-val">10 ብር</div></div>
        <div class="stat-box">የተጠራው<div class="stat-val" id="calledCount">0</div></div>
    </div>

    <!-- የአሁኑ ቁጥር እና የ 3 ሰከንድ ቆጣሪ -->
    <div class="call-display">
        <div id="statusText">ጨዋታውን ለመጀመር ካርድ ይምረጡ (እስከ 3)</div>
        <div style="margin-top: 8px;">
            <div class="current-ball" id="activeNumber">--</div>
        </div>
        <div id="countdown" style="margin-top: 6px; font-weight: bold; color: #fbbf24;"></div>
    </div>

    <!-- ከ 1 እስከ 600 ቁጥሮች (አንድ ሰው 3 ብቻ መምረጥ ይችላል) -->
    <div style="font-size: 13px; margin-bottom: 4px;">ካርድ ይምረጡ (ከ1 እስከ 600 - ቢበዛ 3):</div>
    <div class="cards-grid" id="gridContainer"></div>

    <!-- የዲፖዚት / ክፍያ ሳጥን -->
    <div class="deposit-section">
        <div style="font-weight: bold; margin-bottom: 6px;">ሒሳብ መሙያ (Deposit)</div>
        <button class="pay-btn telebirr" onclick="deposit('telebirr')">በቴሌብር (Telebirr)</button>
        <button class="pay-btn cbe" onclick="deposit('cbe')">በ CBE Birr</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedCards = [];
        const maxSelection = 3;

        // 1-600 ያሉትን ቁጥሮች መፍጠር
        const grid = document.getElementById('gridContainer');
        for (let i = 1; i <= 600; i++) {
            const btn = document.createElement('button');
            btn.className = 'num-btn';
            btn.innerText = i;
            btn.onclick = () => selectNumber(btn, i);
            grid.appendChild(btn);
        }

        function selectNumber(btn, num) {
            if (selectedCards.includes(num)) {
                selectedCards = selectedCards.filter(n => n !== num);
                btn.classList.remove('selected');
            } else {
                if (selectedCards.length >= maxSelection) {
                    alert("አንድ ተጫዋች መያዝ የሚችለው ከፍተኛው 3 ቁጥሮች/ካርዶች ብቻ ነው!");
                    return;
                }
                selectedCards.push(num);
                btn.classList.add('selected');
            }
            document.getElementById('statusText').innerText = `የተመረጡት: ${selectedCards.join(', ')} (${selectedCards.length}/3)`;
        }

        // የአማርኛ ድምፅ አጠራር (Speech Synthesis)
        function speakAmharic(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'am-ET'; // አማርኛ
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // የጨዋታው ቆጣሪ እና የቁጥር ጥሪ
        let called = 0;
        function callNextNumber() {
            let count = 3;
            const cd = document.getElementById('countdown');
            const timer = setInterval(() => {
                cd.innerText = `ቀጣይ ጥሪ በ: ${count} ሰከንድ`;
                count--;
                if (count < 0) {
                    clearInterval(timer);
                    cd.innerText = "";
                    
                    // ቁጥር ማውጣት
                    const letters = ['B', 'I', 'N', 'G', 'O'];
                    const randomLetter = letters[Math.floor(Math.random() * letters.length)];
                    const randomNum = Math.floor(Math.random() * 75) + 1;
                    
                    const callResult = `${randomLetter} ${randomNum}`;
                    document.getElementById('activeNumber').innerText = callResult;
                    
                    called++;
                    document.getElementById('calledCount').innerText = called;
                    
                    // በአማርኛ ማውራት
                    speakAmharic(`${randomLetter} - ${randomNum}`);
                }
            }, 1000);
        }

        function deposit(method) {
            const amount = prompt("የሚያስገቡትን የብር መጠን ያስገቡ (ለምሳሌ 200):");
            if (amount) {
                alert(`የክፍያ ጥያቄ ተልኳል!\nዘዴ: ${method}\nመጠን: ${amount} ብር\nእባክዎ ክፍያውን በቴሌብር/ሲቢኢ ሲያጠናቅቁ ቀሪ ሂሳብዎ ላይ ይደመራል.`);
            }
        }

        // በየ 8 ሰከንዱ ቁጥር ይጠራል (ከ 3 ሰከንድ ቅድመ-ቆጣሪ ጋር)
        setInterval(callNextNumber, 8000);
    </script>
</body>
</html>
