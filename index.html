<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>SEFI Bingo</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4e1d2; }
        .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; max-width: 400px; margin: 20px auto; }
        .cell { background: #fff; padding: 20px; border: 1px solid #ccc; font-weight: bold; }
        button { padding: 15px 30px; font-size: 18px; background: #7209b7; color: #fff; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>SEFI Bingo (ሰፊ ቢንጎ)</h1>
    <div class="board" id="board"></div>
    <button onclick="generateBalls()">ኳስ አውጣ</button>
    <h2 id="currentBall"></h2>

    <script>
        const board = document.getElementById('board');
        const currentBallDisplay = document.getElementById('currentBall');

        for(let i = 0; i < 25; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = Math.floor(Math.random() * 75) + 1;
            board.appendChild(cell);
        }

        function generateBalls() {
            const ball = Math.floor(Math.random() * 75) + 1;
            currentBallDisplay.innerText = "የወጣች ኳስ: " + ball;
            const utterance = new SpeechSynthesisUtterance(ball.toString());
            utterance.lang = 'am-ET';
            window.speechSynthesis.speak(utterance);
        }
    </script></body>
</html>
